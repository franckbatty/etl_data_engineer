
services:

  # ==========================================================
  # 1. SERVICE POSTGRESQL
  # ==========================================================

  postgres:
    image: postgres:15
    container_name: etl_postgres

    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-etl_password}"
      POSTGRES_DB: "${POSTGRES_DB:-etl_dw}"

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================================
  # 2. SERVICE AIRFLOW
  # ==========================================================

  airflow:
    build:
      context: .
      dockerfile: Dockerfile

    image: etl-airflow:2.9.2
    container_name: etl_airflow

    depends_on:
      postgres:
        condition: service_healthy

    environment:

      # Configuration Airflow
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags

      # Clés de sécurité
      AIRFLOW__CORE__FERNET_KEY: "jp20nflyKfPl-Q7Ucf2uucV6zs54UPRFN2iZICELgcQ="
      AIRFLOW__WEBSERVER__SECRET_KEY: "UaSk8XWJyv-wcnKz8u0Pja64_zz4pRQJKWs_n2v58ME"

      # Chemin des modules Python
      PYTHONPATH: /opt/airflow

      # Répertoire des fichiers CSV
      ETL_DATA_DIR: /opt/airflow/data

      # Connexion PostgreSQL pour l'ETL
      ETL_DB_HOST: postgres
      ETL_DB_PORT: "5432"
      ETL_DB_NAME: "${POSTGRES_DB:-etl_dw}"
      ETL_DB_USER: "${POSTGRES_USER:-postgres}"
      ETL_DB_PASSWORD: "${POSTGRES_PASSWORD:-etl_password}"

    ports:
      - "8080:8080"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./config.ini:/opt/airflow/config.ini
      - ./config.yaml:/opt/airflow/config.yaml
      - ./airflow_state:/backup:ro
      - airflow_state_data:/opt/airflow/state

    command: standalone

# ==========================================================
# 3. VOLUMES PERSISTANTS
# ==========================================================

volumes:
  postgres_data:
  airflow_state_data:
