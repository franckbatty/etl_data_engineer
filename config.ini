# Fichier de Configuration à la base de données
# localhost signifie que la base de données est hébergée sur la même machine que celle où 
# le script Python est exécuté. Si la base de données était hébergée sur un serveur distant, 
# vous entreriez l'adresse IP ou le nom de domaine de ce serveur.

[postgresql] 
host: localhost 
port: 5432       # 5433 est le port que j'expose par PostgreSQL dans un service docker.
username: postgres      # Le Nom d'utilisateur administrateur par défaut pour PostgreSQL.
password: etl_password      # Le Mot de passe de l'utilisateur pour se connecter à la base de données PostgreSQL.
database_name: etl_dw  # Le Nom de la base de données à laquelle vous voulez vous connecter.
