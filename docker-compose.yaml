# Fichier de configuration Docker Compose permettant de définir,
# configurer et orchestrer les services PostgreSQL et Apache Airflow.

services:

  # 1. Base de données PostgreSQL
  postgres:
    image: postgres:15
    container_name: etl_postgres
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Initialisation de la base de métadonnées Airflow
  airflow-init:
    build: .
    container_name: airflow_init
    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy

    environment: &airflow_environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}

    volumes: &airflow_volumes
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./config.ini:/opt/airflow/config.ini
      - ./config.yaml:/opt/airflow/config.yaml

    command: >
      bash -c "airflow db migrate &&
      (airflow users list | grep -q admin ||
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com)"

  # 3. Serveur Web Airflow
  airflow-webserver:
    build: .
    container_name: airflow_webserver
    restart: always

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment: *airflow_environment

    volumes: *airflow_volumes

    ports:
      - "8080:8080"

    command: webserver

  # 4. Ordonnanceur Airflow
  airflow-scheduler:
    build: .
    container_name: airflow_scheduler
    restart: always

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment: *airflow_environment

    volumes: *airflow_volumes

    command: scheduler

# Volumes persistants
volumes:
  postgres_data: